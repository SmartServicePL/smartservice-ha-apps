name: Smart Service HA
version: 1.9.25
slug: smartservice_ha
description: Cały dom w prostym panelu — bez konfigurowania i bez znajomości Home Assistant.
url: https://panel.smartservice.net.pl
arch:
- aarch64
- amd64
homeassistant: 2025.10.0
init: false
startup: application
boot: auto
stage: stable
ingress: true
ingress_port: 8099
ingress_stream: false
watchdog: http://[HOST]:[PORT:8099]/healthz
panel_icon: mdi:home-heart
panel_title: Smart Service HA
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: manager
backup: cold
services:
- mqtt:want
map:
- type: homeassistant_config
  read_only: false
  path: /homeassistant
- type: share
  read_only: false
options: {}
schema:
  installation_code: password?
image: ghcr.io/smartservicepl/{arch}-smartservice-ha
